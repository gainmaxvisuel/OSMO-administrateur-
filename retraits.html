<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSMO — Retraits</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07050d;
      color: #f5f3ff;
      min-height: 100vh;
    }

    header {
      background: #0d0918;
      border-bottom: 1px solid #241b3d;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand span {
      color: #9b7cff;
      font-size: 13px;
      display: block;
      margin-top: 3px;
    }

    .back {
      color: #cfc6e9;
      text-decoration: none;
      border: 1px solid #332653;
      background: #130d22;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13px;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 22px 15px 50px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .top h2 {
      font-size: 25px;
    }

    .top p {
      color: #9188a8;
      font-size: 13px;
      margin-top: 5px;
    }

    .filters {
      background: #0d0918;
      border: 1px solid #241b3d;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    select,
    input {
      background: #100b1c;
      color: white;
      border: 1px solid #332653;
      border-radius: 9px;
      padding: 11px 13px;
      outline: none;
    }

    input {
      flex: 1;
      min-width: 220px;
    }

    select:focus,
    input:focus {
      border-color: #8b5cf6;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .refresh {
      background: #6d4aff;
      color: white;
    }

    .approve {
      background: #087f5b;
      color: white;
    }

    .reject {
      background: #9f2430;
      color: white;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .table-wrap {
      background: #0d0918;
      border: 1px solid #241b3d;
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #211832;
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
    }

    th {
      color: #9b7cff;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
      background: #100b1c;
    }

    td {
      color: #ddd8ea;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .transaction {
      font-weight: 700;
      color: #fff;
      letter-spacing: .4px;
    }

    .user-id {
      color: #9188a8;
      font-size: 11px;
      max-width: 150px;
      word-break: break-all;
    }

    .amount {
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }

    .net {
      color: #57d6ad;
      font-weight: 700;
      white-space: nowrap;
    }

    .fee {
      color: #d9a9b0;
      white-space: nowrap;
    }

    .beneficiary {
      color: #fff;
      font-weight: 600;
    }

    .wave {
      color: #cfc6e9;
      font-weight: 600;
      white-space: nowrap;
    }

    .operator {
      color: #9b7cff;
      font-size: 11px;
      display: block;
      margin-top: 3px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pending {
      background: #3a2d09;
      color: #f5cf5c;
    }

    .approved {
      background: #073a2b;
      color: #55d9ae;
    }

    .rejected {
      background: #42151b;
      color: #ff8792;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #817993;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #9b7cff;
    }

    .error {
      background: #3a1218;
      border: 1px solid #70232d;
      color: #ff9ba5;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #083526;
      border: 1px solid #126247;
      color: #69e0b7;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .count {
      color: #8f86a5;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 10px 40px;
      }

      .top h2 {
        font-size: 21px;
      }

      .back {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img src="../logo.png" alt="OSMO">

      <div>
        <h1>OSMO</h1>
        <span>Administration</span>
      </div>
    </div>

    <a class="back" href="dashboard.html">
      Retour au dashboard
    </a>

  </div>
</header>

<main class="container">

  <div class="top">

    <div>
      <h2>Gestion des retraits</h2>

      <p>
        Consulte et traite les demandes de retrait des utilisateurs.
      </p>
    </div>

    <div class="count" id="count">
      0 demande
    </div>

  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div class="filters">

    <select id="status">
      <option value="all">Tous les retraits</option>
      <option value="pending" selected>En attente</option>
      <option value="approved">Approuvés</option>
      <option value="rejected">Rejetés</option>
    </select>

    <input
      type="text"
      id="search"
      placeholder="Rechercher par utilisateur, téléphone, ID..."
    >

    <button
      class="btn refresh"
      id="refresh">
      Actualiser
    </button>

  </div>

  <div class="table-wrap">

    <div id="loading" class="loading">
      Chargement des retraits...
    </div>

    <table id="table" style="display:none;">

      <thead>

        <tr>
          <th>Transaction</th>
          <th>Utilisateur</th>
          <th>Montant</th>
          <th>Frais</th>
          <th>Net à payer</th>
          <th>Bénéficiaire</th>
          <th>WAVE</th>
          <th>Statut</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody id="tbody"></tbody>

    </table>

    <div
      id="empty"
      class="empty"
      style="display:none;">
      Aucune demande de retrait trouvée.
    </div>

  </div>

</main>

<script>

  const SUPABASE_URL =
    "https://ubzcivowwhglvzpyeueg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_oPjQfIoZzfv1LuLAfsua4g_97K_tXSO";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const SESSION_KEY =
    "osmo_admin_session_token";

  let withdrawals = [];

  function getSession() {
    return localStorage.getItem(SESSION_KEY);
  }

  function showError(message) {

    const el =
      document.getElementById("error");

    el.textContent = message;
    el.style.display = "block";

    document.getElementById("success")
      .style.display = "none";
  }

  function showSuccess(message) {

    const el =
      document.getElementById("success");

    el.textContent = message;
    el.style.display = "block";

    document.getElementById("error")
      .style.display = "none";

    setTimeout(() => {
      el.style.display = "none";
    }, 4000);
  }

  function hideMessages() {

    document.getElementById("error")
      .style.display = "none";

    document.getElementById("success")
      .style.display = "none";
  }

  function formatMoney(value) {

    return Number(value || 0)
      .toLocaleString("fr-FR") +
      " XOF";
  }

  function formatDate(value) {

    if (!value) return "-";

    return new Date(value)
      .toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
  }

  function statusLabel(status) {

    if (status === "pending")
      return "En attente";

    if (status === "approved")
      return "Approuvé";

    if (status === "rejected")
      return "Rejeté";

    return status || "-";
  }

  function statusClass(status) {

    if (status === "approved")
      return "approved";

    if (status === "rejected")
      return "rejected";

    return "pending";
  }

  function safe(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "-";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function matchesSearch(row, query) {

    if (!query)
      return true;

    const text = [

      row.id,
      row.transaction_id,
      row.user_id,
      row.account_id,
      row.account_phone,
      row.beneficiary_name,
      row.operator,
      row.amount_requested,
      row.fee_amount,
      row.net_amount,
      row.status

    ].join(" ").toLowerCase();

    return text.includes(
      query.toLowerCase()
    );
  }

  function render() {

    const tbody =
      document.getElementById("tbody");

    const table =
      document.getElementById("table");

    const empty =
      document.getElementById("empty");

    const search =
      document.getElementById("search")
        .value
        .trim();

    tbody.innerHTML = "";

    const filtered =
      withdrawals.filter(row =>
        matchesSearch(row, search)
      );

    document.getElementById("count")
      .textContent =
      filtered.length +
      (
        filtered.length > 1
          ? " demandes"
          : " demande"
      );

    if (!filtered.length) {

      table.style.display = "none";
      empty.style.display = "block";

      return;
    }

    empty.style.display = "none";
    table.style.display = "table";

    filtered.forEach(row => {

      const tr =
        document.createElement("tr");

      const isPending =
        row.status === "pending";

      tr.innerHTML = `

        <td>
          <span class="transaction">
            ${safe(row.transaction_id || row.id)}
          </span>
        </td>

        <td>
          <span class="user-id">
            ${safe(row.user_id)}
          </span>
        </td>

        <td>
          <span class="amount">
            ${formatMoney(row.amount_requested)}
          </span>
        </td>

        <td>
          <span class="fee">
            ${formatMoney(row.fee_amount)}
          </span>
        </td>

        <td>
          <span class="net">
            ${formatMoney(row.net_amount)}
          </span>
        </td>

        <td>
          <span class="beneficiary">
            ${safe(row.beneficiary_name)}
          </span>
        </td>

        <td>

          <span class="wave">
            ${safe(row.account_phone)}
          </span>

          <span class="operator">
            ${safe(row.operator || "WAVE")}
          </span>

        </td>

        <td>

          <span class="status ${statusClass(row.status)}">
            ${statusLabel(row.status)}
          </span>

        </td>

        <td>
          ${formatDate(row.created_at)}
        </td>

        <td>

          <div class="actions">

            ${
              isPending
                ? `

                  <button
                    class="btn approve"
                    onclick="approveWithdrawal('${row.id}')">
                    Approuver
                  </button>

                  <button
                    class="btn reject"
                    onclick="rejectWithdrawal('${row.id}')">
                    Rejeter
                  </button>

                `
                : "-"
            }

          </div>

        </td>
      `;

      tbody.appendChild(tr);
    });
  }

  async function loadWithdrawals() {

    hideMessages();

    const sessionToken =
      getSession();

    if (!sessionToken) {

      window.location.href =
        "index.html";

      return;
    }

    document.getElementById("loading")
      .style.display = "block";

    document.getElementById("table")
      .style.display = "none";

    document.getElementById("empty")
      .style.display = "none";

    const status =
      document.getElementById("status")
        .value;

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "admin_withdrawals",
        {
          p_session_token:
            sessionToken,

          p_status:
            status
        }
      );

    document.getElementById("loading")
      .style.display = "none";

    if (error) {

      console.error(error);

      if (
        String(error.message || "")
          .toLowerCase()
          .includes("session")
      ) {

        localStorage.removeItem(
          SESSION_KEY
        );

        window.location.href =
          "index.html";

        return;
      }

      showError(
        "Impossible de charger les retraits : " +
        error.message
      );

      return;
    }

    withdrawals =
      data || [];

    render();
  }

  async function approveWithdrawal(id) {

    if (
      !confirm(
        "Confirmer l'approbation de ce retrait ?"
      )
    ) {
      return;
    }

    const sessionToken =
      getSession();

    if (!sessionToken) {

      window.location.href =
        "index.html";

      return;
    }

    const { error } =
      await supabaseClient.rpc(
        "admin_approve_withdrawal",
        {
          p_session_token:
            sessionToken,

          p_withdrawal_id:
            id
        }
      );

    if (error) {

      console.error(error);

      showError(
        "Erreur lors de l'approbation : " +
        error.message
      );

      return;
    }

    showSuccess(
      "Le retrait a été approuvé."
    );

    await loadWithdrawals();
  }

  async function rejectWithdrawal(id) {

    if (
      !confirm(
        "Confirmer le rejet de ce retrait ?"
      )
    ) {
      return;
    }

    const sessionToken =
      getSession();

    if (!sessionToken) {

      window.location.href =
        "index.html";

      return;
    }

    const { error } =
      await supabaseClient.rpc(
        "admin_reject_withdrawal",
        {
          p_session_token:
            sessionToken,

          p_withdrawal_id:
            id
        }
      );

    if (error) {

      console.error(error);

      showError(
        "Erreur lors du rejet : " +
        error.message
      );

      return;
    }

    showSuccess(
      "Le retrait a été rejeté et le montant a été remboursé."
    );

    await loadWithdrawals();
  }

  document
    .getElementById("status")
    .addEventListener(
      "change",
      loadWithdrawals
    );

  document
    .getElementById("search")
    .addEventListener(
      "input",
      render
    );

  document
    .getElementById("refresh")
    .addEventListener(
      "click",
      loadWithdrawals
    );

  loadWithdrawals();

</script>

</body>
</html>
